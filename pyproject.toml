[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-mistral-mcp"
version = "1.0.0"
description = "MCP stdio bridge that exposes the Mistral Vibe agent (over ACP) and Mistral Studio lookups to MCP clients"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "LICENSE-APACHE-2.0"]
authors = [{ name = "Dan Alec" }]
keywords = ["mcp", "model-context-protocol", "acp", "agent-client-protocol", "mistral", "vibe"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: JavaScript",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/danalec/vibe-mistral-mcp"
Source = "https://github.com/danalec/vibe-mistral-mcp"
Issues = "https://github.com/danalec/vibe-mistral-mcp/issues"

[tool.setuptools]
py-modules = ["vibe_mcp", "studio", "vibe_doctor"]

[tool.setuptools.package-data]
"*" = ["*.mjs"]
